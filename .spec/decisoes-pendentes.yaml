  - id: D18
    titulo: "⚠️ Painéis HTML de admin (/api/v1/admin/*/panel) inacessíveis pelo navegador"
    area: produto
    status: pendente
    bloqueante: true
    contexto: >
      Os painéis de pedidos, cupons, downloads, usuários e cadastro exigem cabeçalho
      `Authorization: Bearer`, que o navegador não envia ao abrir uma página; nada no SPA ou no
      SQLAdmin leva até eles. Na base visual do admin eles mostram só "Não autenticado".
    opcoes:
      - nome: aceitar também a sessão do SQLAdmin (cookie) nesses painéis
        tradeoff: painéis voltam a abrir no navegador; duas formas de autenticar no backend
      - nome: aposentar os painéis e concentrar tudo no SQLAdmin
        tradeoff: um painel só; perde telas feitas sob medida (cadastro rápido, gráficos)
      - nome: painel admin como tela do SPA chamando a API com Bearer
        tradeoff: mais trabalho de frontend; mesma autenticação da loja
    escolhida: nenhuma — aguardando você
    porque: é escolha de produto/arquitetura do painel, não correção
    reversivel: true

  - id: D19
    titulo: "⚠️ Limite de login por IP atrás do nginx (todo mundo com o mesmo IP)"
    area: segurança
    status: pendente
    bloqueante: true
    contexto: >
      O backend limita 10 logins/min por IP e bloqueia o e-mail após 5 falhas. Atrás do nginx (e do
      túnel Cloudflare) o backend vê só o IP do nginx: o limite vale para o site inteiro. O uvicorn só
      confia em X-Forwarded-For de 127.0.0.1. O mesmo ponto afeta HTTPS atrás do túnel: o backend não
      enxerga o esquema original ao montar URLs absolutas (painel /admin via https pode dar conteúdo misto).
    opcoes:
      - nome: nginx repassa X-Forwarded-For/Proto e o uvicorn confia na rede do compose (--forwarded-allow-ips)
        tradeoff: limite por cliente real; exige cuidado para não confiar em cabeçalho forjado de fora
      - nome: manter
        tradeoff: 10 logins/min para todos os usuários somados
    escolhida: nenhuma — aguardando você (decisão de segurança)
    reversivel: true

