# Decisões tomadas sem consulta, para o dono do projeto (Micael) analisar depois das rodadas.
# Fonte legível por máquina; a versão "mastigada" é .spec/decisoes-pendentes.md.
#
# Cada decisão: contexto, opções com trade-off, a escolhida e por quê, se é
# reversível e o que muda se o dono escolher outra. Decisão analisada muda de
# `status: pendente` para `aprovada` ou `revertida` — o histórico não se apaga.
#
# `bloqueante: true` = NÃO foi implementada; está guardada esperando a escolha do dono.

gerado_em: "2026-09-27"
sessao: "adoção do /qa no e_seller + rodadas de QA, healing e ajuste (execução autônoma noturna)"

decisoes:
  - id: D01
    titulo: Onde bloquear git add, commit e push do Claude (e leitura de .env)
    area: ferramentas
    status: pendente
    bloqueante: false
    contexto: >
      Pedido: o chat nunca executa git add/commit/push e nunca lê .env nem segredo.
      Precisa valer de verdade, não só como lembrete no CLAUDE.md.
    opcoes:
      - nome: projeto versionado (.claude/settings.json) com deny + hook
        tradeoff: vale para qualquer sessão neste repo e em qualquer máquina que clonar; entra no git
      - nome: só nesta máquina (.claude/settings.local.json)
        tradeoff: não vai para o git; quem clonar não herda a regra
      - nome: global (~/.claude/settings.json)
        tradeoff: vale para todos os projetos da máquina, inclusive onde commit autônomo é desejado
    escolhida: projeto versionado (.claude/settings.json) com deny + hook
    porque: >
      A regra é deste projeto e a skill /qa já exige "commits só propostos". Deny por
      prefixo sozinho não pega `git -C dir commit` nem comandos encadeados; o hook pega.
      O mesmo hook barra `cat/type/Get-Content` em arquivo `.env` (o `.env.example` passa).
      Testado com 14 casos (8 bloqueios, 6 liberações) antes de valer.
    reversivel: true
    como_reverter: apagar as regras e o hook de .claude/settings.json

  - id: D02
    titulo: Hook conservador barra até texto que só menciona "git add/commit/push"
    area: ferramentas
    status: pendente
    bloqueante: false
    contexto: >
      O hook lê o comando bruto. Um comando que só ESCREVE esse texto (heredoc, echo)
      também é barrado.
    opcoes:
      - nome: manter conservador
        tradeoff: zero chance de commit escapar; falso positivo raro, contornado com as ferramentas de edição
      - nome: parser de shell mais preciso
        tradeoff: menos falso positivo, mais código e mais chance de brecha
    escolhida: manter conservador
    porque: o custo do falso positivo é baixo; o do falso negativo é um commit indevido
    reversivel: true

