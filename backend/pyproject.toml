[project]
name = "e-seller-backend"
version = "0.2.0"
description = "Backend do e_seller (portal de venda de e-books) — API FastAPI."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.50",
    "alembic==1.18.4",
    "psycopg[binary]>=3.2,<3.3",
    "aiosqlite==0.21.0",
    "greenlet==3.5.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "sqladmin==0.21.0",
    "itsdangerous==2.2.0",
    "pyotp>=2.9",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py314"
# Migrations autogeradas pelo Alembic não seguem todas as regras de estilo.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# NÃO habilitar "C4" (incentiva comprehensions, contra nosso padrão).
select = ["E", "F", "I", "B", "UP", "N"]
# N818: usamos nomes declarativos de exceção (ProductNotFound, GrantExpired...)
# sem o sufixo "Error" — decisão de estilo do projeto.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Routers que geram HTML inline têm linhas de CSS/JS longas inevitavelmente.
"app/accounts/router_admin.py" = ["E501"]
"app/catalog/router_admin.py" = ["E501"]
"app/coupons/router_admin.py" = ["E501"]
"app/orders/router_admin_html.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Idioma do FastAPI: estas "chamadas" em defaults de argumento são seguras.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
