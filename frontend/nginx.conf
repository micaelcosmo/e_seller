# Nginx do storefront: serve a SPA e faz proxy reverso da API/painel para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API, painel e fluxo server-rendered do backend (mesma origem → sem CORS).
    location /api/        { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /docs        { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /redoc       { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /admin       { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /statics/    { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /comprar     { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /pay/        { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /pedido/     { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # SPA: tudo o mais cai no index.html (rotas no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
