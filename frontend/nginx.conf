# Nginx do storefront: serve a SPA e faz proxy reverso da API/painel para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Host com a porta ($http_host, não $host): o backend (SQLAdmin, links de checkout)
    # monta URLs absolutas a partir dele — sem a porta, o redirecionamento vai para :80.
    proxy_set_header Host $http_host;

    # API, painel e fluxo server-rendered do backend (mesma origem → sem CORS).
    location /api/        { proxy_pass http://backend:8000; }
    location /docs        { proxy_pass http://backend:8000; }
    location /redoc       { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }
    location /admin       { proxy_pass http://backend:8000; }
    location /statics/    { proxy_pass http://backend:8000; }
    location /comprar     { proxy_pass http://backend:8000; }
    location /pay/        { proxy_pass http://backend:8000; }
    location /pedido/     { proxy_pass http://backend:8000; }

    # Folhas de estilo/JS das páginas server-rendered (simulador, pedido, institucionais).
    location /static/     { proxy_pass http://backend:8000; }

    # Páginas institucionais e utilitárias servidas pelo backend (links do rodapé, SEO, saúde).
    location = /privacidade      { proxy_pass http://backend:8000; }
    location = /termos           { proxy_pass http://backend:8000; }
    location = /recuperar-senha  { proxy_pass http://backend:8000; }
    location = /sitemap.xml      { proxy_pass http://backend:8000; }
    location = /health           { proxy_pass http://backend:8000; }

    # SPA: tudo o mais cai no index.html (rotas no cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
