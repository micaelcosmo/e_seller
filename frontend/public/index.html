<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="e_seller — loja de e-books. Compre e baixe na hora.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="e_seller — sua loja de e-books">
  <meta property="og:description" content="Compre e-books e baixe instantaneamente. Pagamento via Pix, cartão ou boleto.">
  <meta property="og:locale" content="pt_BR">
  <meta name="theme-color" content="#7c5cff">
  <link rel="canonical" href="/">
  <title>e_seller — sua loja de e-books</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="Página inicial">📚 e_seller</a>
    <div class="search">
      <input id="search-input" type="search" placeholder="Buscar por título ou autor…"
             aria-label="Buscar e-books" title="Digite e tecle Enter para buscar">
    </div>
    <nav class="actions">
      <button id="cart-btn" class="ghost hidden" title="Seu carrinho">🛒 Carrinho</button>
      <button id="lib-btn" class="ghost hidden" title="Seus e-books comprados">📚 Biblioteca</button>
      <button id="orders-btn" class="ghost hidden" title="Meus pedidos">🧾 Pedidos</button>
      <button id="account-btn" class="ghost hidden" title="Minha conta (perfil fiscal)">Conta</button>
      <a href="/admin" class="ghost" title="Painel do vendedor (admin)">Admin</a>
      <button id="auth-btn" class="ghost" title="Entrar ou criar conta">Entrar</button>
    </nav>
  </header>

  <main id="app">
    <section id="hero" class="hero">
      <h1>E-books, na hora.</h1>
      <p>Compre, pague e baixe em segundos. Simples assim.</p>
    </section>
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <form id="news-form" class="news">
      <input id="news-email" type="email" placeholder="Receba novidades por e-mail"
             aria-label="E-mail para newsletter" title="Seu e-mail">
      <button class="ghost" type="submit" title="Assinar a newsletter">Assinar</button>
    </form>
    <span>e_seller · demo · <a href="/docs" title="Documentação da API">API</a></span>
  </footer>

  <!-- Modal de autenticação -->
  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Entrar">
    <div class="modal-card">
      <button class="modal-close" id="auth-close" title="Fechar" aria-label="Fechar">×</button>
      <div class="tabs">
        <button class="tab active" data-tab="login">Entrar</button>
        <button class="tab" data-tab="register">Criar conta</button>
      </div>
      <form id="auth-form" class="form" novalidate>
        <input name="full_name" id="reg-name" type="text" placeholder="Seu nome"
               class="hidden" aria-label="Nome completo" autocomplete="name"
               title="Como quer ser chamado">
        <input name="email" type="email" placeholder="seu@email.com" required
               aria-label="E-mail" autocomplete="email" title="Seu e-mail"
               aria-required="true">
        <input name="password" type="password" placeholder="Senha (mín. 6 caracteres)"
               required minlength="6" aria-label="Senha" autocomplete="current-password"
               title="Mínimo 6 caracteres" aria-required="true">
        <div id="auth-error" role="alert" aria-live="assertive" class="hidden"
             style="color:#f87171;font-size:.9rem;margin-top:.25rem"></div>
        <button type="submit" class="primary" id="auth-submit">Entrar</button>
        <p id="auth-privacy" class="hidden" style="font-size:.75rem;color:#9aa;margin-top:.5rem">
          Ao criar conta, você concorda com os
          <a href="/termos" style="color:#9aa">Termos de uso</a> e a
          <a href="/privacidade" style="color:#9aa">Política de privacidade</a>.
        </p>
      </form>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <footer style="text-align:center;padding:1.5rem 0;color:#888;font-size:.85rem">
    <a href="/privacidade" style="color:#9aa">Privacidade</a> &nbsp;·&nbsp;
    <a href="/termos" style="color:#9aa">Termos de uso</a>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
