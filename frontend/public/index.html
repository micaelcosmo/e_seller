<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="e_seller — loja de e-books. Compre e baixe na hora.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="e_seller — sua loja de e-books">
  <meta property="og:description" content="Compre e-books e baixe instantaneamente. Pagamento via Pix, cartão ou boleto.">
  <meta property="og:locale" content="pt_BR">
  <meta name="theme-color" content="#7c5cff">
  <link rel="canonical" href="/">
  <title>e_seller — sua loja de e-books</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Sprite de ícones SVG (UXR-04) — estilo stroke 24px, herda currentColor.
       Uso: <svg class="icon"><use href="#i-cart"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </symbol>
      <symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </symbol>
      <symbol id="i-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 6l4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>
      </symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor" stroke="none">
        <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
      </symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
      </symbol>
    </defs>
  </svg>

  <header class="topbar">
    <a class="brand" href="#/" title="Página inicial">
      <svg class="icon brand-icon" aria-hidden="true"><use href="#i-book"/></svg>
      <span>e_seller</span>
    </a>
    <div class="search">
      <div class="search-wrap">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Buscar por título ou autor…"
               aria-label="Buscar e-books" title="Digite e tecle Enter para buscar">
      </div>
    </div>
    <button id="menu-toggle" class="ghost icon-btn menu-toggle" aria-label="Abrir menu"
            aria-expanded="false" title="Menu">
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>
    <nav class="actions">
      <button id="cart-btn" class="ghost hidden" title="Seu carrinho">
        <svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg>
        <span class="btn-label">Carrinho</span>
        <span id="cart-count" class="cart-count hidden" aria-live="polite">0</span>
      </button>
      <button id="lib-btn" class="ghost hidden" title="Seus e-books comprados">
        <svg class="icon" aria-hidden="true"><use href="#i-library"/></svg>
        <span class="btn-label">Biblioteca</span>
      </button>
      <button id="orders-btn" class="ghost hidden" title="Meus pedidos">
        <svg class="icon" aria-hidden="true"><use href="#i-receipt"/></svg>
        <span class="btn-label">Pedidos</span>
      </button>
      <button id="account-btn" class="ghost hidden" title="Minha conta (perfil fiscal)">
        <svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>
        <span class="btn-label">Conta</span>
      </button>
      <a id="admin-link" href="/admin" class="ghost hidden" title="Painel do vendedor (admin)">Admin</a>
      <button id="auth-btn" class="ghost" title="Entrar ou criar conta">Entrar</button>
    </nav>
  </header>

  <main id="app">
    <section id="hero" class="hero">
      <h1>E-books, na hora.</h1>
      <p>Compre, pague e baixe em segundos. Simples assim.</p>
    </section>
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <form id="news-form" class="news" novalidate>
      <input id="news-email" type="email" placeholder="Receba novidades por e-mail"
             aria-label="E-mail para newsletter" title="Seu e-mail" autocomplete="email">
      <button class="ghost" type="submit" title="Assinar a newsletter">Assinar</button>
    </form>
    <p id="news-error" class="news-error" role="alert" aria-live="polite"></p>
    <nav class="footer-links">
      <a href="/privacidade" title="Política de privacidade">Privacidade</a>
      <span aria-hidden="true">·</span>
      <a href="/termos" title="Termos de uso">Termos de uso</a>
      <span aria-hidden="true">·</span>
      <a href="/docs" title="Documentação da API">API</a>
    </nav>
    <span class="footer-copy">e_seller · demo</span>
  </footer>

  <!-- Modal de autenticação -->
  <div id="auth-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Entrar">
    <div class="modal-card">
      <button class="modal-close" id="auth-close" title="Fechar" aria-label="Fechar">×</button>
      <div class="tabs">
        <button class="tab active" data-tab="login">Entrar</button>
        <button class="tab" data-tab="register">Criar conta</button>
      </div>
      <form id="auth-form" class="form" novalidate>
        <input name="full_name" id="reg-name" type="text" placeholder="Seu nome"
               class="hidden" aria-label="Nome completo" autocomplete="name"
               title="Como quer ser chamado">
        <input name="email" type="email" placeholder="seu@email.com" required
               aria-label="E-mail" autocomplete="email" title="Seu e-mail"
               aria-required="true">
        <input name="password" type="password" placeholder="Senha (mín. 6 caracteres)"
               required minlength="6" aria-label="Senha" autocomplete="current-password"
               title="Mínimo 6 caracteres" aria-required="true">
        <div id="auth-error" role="alert" aria-live="assertive" class="hidden"
             style="color:#f87171;font-size:.9rem;margin-top:.25rem"></div>
        <button type="submit" class="primary" id="auth-submit">Entrar</button>
        <p id="auth-privacy" class="hidden" style="font-size:.75rem;color:#9aa;margin-top:.5rem">
          Ao criar conta, você concorda com os
          <a href="/termos" style="color:#9aa">Termos de uso</a> e a
          <a href="/privacidade" style="color:#9aa">Política de privacidade</a>.
        </p>
      </form>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="/app.js"></script>
</body>
</html>
